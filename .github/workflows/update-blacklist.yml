name: Update Blacklist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sources.txt'
      - 'custom.txt'
      - 'whitelist.txt'
      - 'rewrites.txt'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Blacklist Builder
        run: python3 scripts/build.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blacklist.txt hosts.txt domains.txt youtube-rewrite.txt youtube-hosts.txt
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-update blacklist [$(date -u +'%Y-%m-%d')]"
            git push origin main
          fi
